$lock_cmd = __HOME__/.config/hypr-macshell/scripts/maclock.sh
# previous: $lock_cmd = pidof hyprlock || hyprlock   (backup: hypridle.conf.bak-hyprlock)
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3
}

# Idle listeners disabled: keep-awake always on (no idle lock/screen-off/suspend).
