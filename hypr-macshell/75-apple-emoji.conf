<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- MacShell: Apple's emoji first, everywhere (installed in ~/.local/share/fonts/apple-emoji) -->
<fontconfig>
  <alias binding="strong"><family>emoji</family><prefer><family>Apple Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Apple Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Apple Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Apple Color Emoji</family></prefer></alias>
  <match target="pattern">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Apple Color Emoji</string></edit>
  </match>
</fontconfig>
