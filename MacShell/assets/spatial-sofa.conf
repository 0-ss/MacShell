context.properties = {
    core.daemon = false
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "360 Spatial Audio (HRTF)"
            media.name       = "360 Spatial Audio (HRTF)"
            filter.graph = {
                nodes = [
                    {
                        type   = sofa
                        label  = spatializer
                        name   = spFL
                        config = {
                            filename = "/usr/share/libmysofa/default.sofa"
                        }
                        control = {
                            "Azimuth"   = 30.0
                            "Elevation" = 0.0
                            "Radius"    = 1.2
                        }
                    }
                    {
                        type   = sofa
                        label  = spatializer
                        name   = spFR
                        config = {
                            filename = "/usr/share/libmysofa/default.sofa"
                        }
                        control = {
                            "Azimuth"   = 330.0
                            "Elevation" = 0.0
                            "Radius"    = 1.2
                        }
                    }
                    { type = builtin label = mixer name = mixL }
                    { type = builtin label = mixer name = mixR }
                ]
                links = [
                    { output = "spFL:Out L" input = "mixL:In 1" }
                    { output = "spFL:Out R" input = "mixR:In 1" }
                    { output = "spFR:Out L" input = "mixL:In 2" }
                    { output = "spFR:Out R" input = "mixR:In 2" }
                ]
                inputs  = [ "spFL:In" "spFR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            capture.props = {
                node.name      = "macshell_spatial_360"
                media.class    = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = "macshell_spatial_360.output"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
